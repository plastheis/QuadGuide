platform:
  name: orange_pi5           # key into platform/factory.py PLATFORMS dict
  camera:
    backend: gstreamer       # "v4l2" | "gstreamer" | "virtual"
    pipeline: "v4l2src device=/dev/video0 ! video/x-raw,width=640,height=480,framerate=60/1 ! appsink"
    width: 640
    height: 480
    fps: 60
  serial:
    port: /dev/ttyAMA0    # UART device path — change per SBC (e.g. /dev/ttyAMA0 on RPi4)
    baud: 420000          # CRSF standard — do not change without matching FC config
    rx_pin: "GPIO15"      # wiring reference only — not used by driver
    tx_pin: "GPIO14"      # wiring reference only — not used by driver
  inference:
    device: cpu             # "cpu" | "cuda" | "rknn" | "tensorrt"
    backbone: models/nanotrack_backbone.onnx
    head: models/nanotrack_head.onnx
  realtime:
    kcf_cpu_core: 1
    control_cpu_core: 3
    control_sched_fifo: true
    control_fifo_prio: 80

airframe:
  name: flix_micro
  mass_kg: 0.18
  inertia: [0.0012, 0.0012, 0.0020]
  control_limits:
    max_roll_deg: 35
    max_pitch_deg: 35
    max_roll_rate_dps: 200
    max_pitch_rate_dps: 200

tracker:
  ccv: mosse
  ncv: nanotrack
  nanotrack:
    exemplar_sz: 127
    instance_sz: 255
    score_threshold: 0.25
  fusion:
    algorithm: iou_gated  # "confidence_weighted" | "iou_gated" | "passthrough"
    fast_tracker: ccv               # "ccv" | "ncv" — high-rate sync tracker (used by iou_gated)
    confidence_gate: 0.7
    iou_divergence_thresh: 0.3
    ncv_staleness_ms: 100
    iou_velocity_ema_alpha: 0.3     # iou_gated: EMA smoothing for dead-reckoning velocity
    iou_thresh_high: 0.7            # iou_gated: above this IoU → light blend toward slow
    iou_thresh_low: 0.3             # iou_gated: below this IoU → use slow directly

guidance:
  N: 4.0
  closing_vel_fallback: 2.0
  fov_horizontal_rad: 1.047   # camera horizontal FoV (~60°)
  throttle_hold: 0.55         # constant throttle during tracking (0–1)
  closing_vel_ema_alpha: 0.3  # EMA smoothing for bbox area rate (0=heavy, 1=raw)
  closing_vel_min_area_rate: 0.001  # fallback if smoothed area rate is below this
  closing_vel_area_scale: 5.0       # area-rate (normalised/s) → m/s conversion

watchdog:
  target_estimate_ms: 150
  fc_attitude_ms: 50
  guidance_accel_ms: 100

link:
  tx_rate_hz: 50          # RC channels uplink rate to FC (Hz) — must stay constant to keep FC out of failsafe
  diff_lowpass_alpha: 0.3 # LP filter alpha for attitude-derived body rates (0=heavy smooth, 1=raw)
  channels:
    # madflight channel calibration (µs). Used by encode_rc to map ControlCmd to CRSF ticks.
    roll:        {min_us: 1100, mid_us: 1500, max_us: 1900}
    pitch:       {min_us: 1100, mid_us: 1500, max_us: 1900}
    throttle:    {min_us: 1100, max_us: 1900}
    yaw:         {min_us: 1100, mid_us: 1500, max_us: 1900}
    arm:         {disarmed_us: 988, armed_us: 2012}
    flight_mode: {mode_index: 4, positions_us: [1165, 1295, 1425, 1555, 1685, 1815]}
    # Full-stick scale — must match madflight constants exactly.
    # Rate mode (mode_index 0-3): roll_pitch_scale = maxRollRate = 60 dps, yaw_rate_scale = maxYawRate = 160 dps
    # Angle mode (mode_index 4-5): roll_pitch_scale = maxRoll = 30 deg, yaw_rate_scale = maxYawRate = 160 dps
    roll_pitch_scale: 30.0
    yaw_rate_scale: 160.0

mission:
  mode: bench_hil             # "flight" | "bench_hil" | "swil"
  hil:
    target_model: constant_velocity
    initial_offset_m: [2.0, 0.0, 0.0]
    target_speed_mps: 1.5

logging:
  level: INFO
  dir: /var/log/quadguide
  max_bytes: 10485760         # 10 MB per file
  backup_count: 3

bus:
  ring_depth: 8
