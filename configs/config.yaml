platform:
  name: orange_pi5           # label only; camera backend comes from camera.backend
  camera:
    # HIL toggle: set backend=network (+ serial.mode=tcp below) to drive the
    # stack from the dev-machine simulator instead of real hardware.
    backend: v4l2       # "v4l2" | "gstreamer" | "virtual" | "network" (HIL)
    pipeline: "v4l2src device=/dev/video0 ! video/x-raw,width=640,height=480,framerate=60/1 ! appsink"
    width: 640
    height: 480
    fps: 60
    url: "http://192.168.1.100:8090/camera"   # used when backend=network — dev-machine MJPEG stream
  serial:
    # MAVLink2 link to the ArduPilot FC. HIL: set mode=tcp (+ camera backend) to
    # drive the stack from ArduPilot SITL instead of real hardware.
    mode: uart            # "uart" (real FC) | "tcp" (HIL — MAVLink2 over TCP to SITL)
    port: /dev/ttyAMA0    # used when mode=uart — UART device path, change per SBC
    baud: 115200          # H743 MAVLink2 baud — TODO confirm SERIALn_BAUD (115200 vs 921600)
    tcp_host: "127.0.0.1" # used when mode=tcp — ArduPilot SITL host
    tcp_port: 5760        # used when mode=tcp — SITL MAVLink TCP port
    rx_pin: "GPIO15"      # wiring reference only — not used by driver
    tx_pin: "GPIO14"      # wiring reference only — not used by driver
  realtime:
    tracker_cpu_core: 1
    control_cpu_core: 3
    control_sched_fifo: true
    control_fifo_prio: 80

airframe:
  name: flix_micro
  mass_kg: 0.18
  inertia: [0.0012, 0.0012, 0.0020]
  control_limits:
    max_roll_deg: 35
    max_pitch_deg: 35
    max_roll_rate_dps: 200
    max_pitch_rate_dps: 200

tracker:
  import: cv2:TrackerKCF       # "module:Class" — cv2:* uses built-in OpenCV adapter
  params: {}                   # passed to tracker constructor as **kwargs

guidance:
  method: pure_pursuit              # "pronav" | "pure_pursuit"
  fov_horizontal_rad: 0.972   # Logitech C920 @ 640x480 (4:3, sides cropped from 16:9 sensor) ≈ 55.7°
  throttle_hold: 0.4         # constant throttle during tracking (0–1)
  pronav:
    N: 4.0                    # PN navigation gain (typical 3–5)
    closing_vel_fallback: 2.0
    closing_vel_ema_alpha: 0.3       # EMA smoothing for bbox area rate (0=heavy, 1=raw)
    closing_vel_min_area_rate: 0.001 # fallback if smoothed area rate is below this
    closing_vel_area_scale: 5.0      # area-rate (normalised/s) → m/s conversion
  pure_pursuit:
    K: 20                    # m/s² per radian of LOS angle
    deadband: 0.03           # centroid half-width (frac of half-FoV) zeroed near boresight

watchdog:
  target_estimate_ms: 200
  fc_attitude_ms: 250
  fc_imu_ms: 250
  guidance_accel_ms: 100

link:
  tx_rate_hz: 50          # SET_ATTITUDE_TARGET stream rate (Hz) — keep constant to hold GUIDED setpoints
  stream_rate_hz: 50      # requested ATTITUDE + RAW_IMU telemetry rate (Hz)
  system_id: 1            # quadguide MAVLink source system id
  component_id: 191       # MAV_COMP_ID_ONBOARD_COMPUTER
  target_system: 1        # FC system id (corrected at runtime from the first HEARTBEAT)
  target_component: 1     # MAV_COMP_ID_AUTOPILOT1
  arm_retry_count: 5      # arm/disarm COMMAND_LONG retransmits before giving up
  heartbeat_wait_s: 5.0   # max wait for the first FC HEARTBEAT before requesting streams

mission:
  mode: bench_hil             # "flight" | "bench_hil" | "swil"
  hil:
    target_model: constant_velocity
    initial_offset_m: [2.0, 0.0, 0.0]
    target_speed_mps: 1.5

logging:
  level: INFO
  dir: /var/log/quadguide
  max_bytes: 10485760         # 10 MB per file
  backup_count: 3

bus:
  ring_depth: 8

ground:
  port: 8080
  ui_mode: minimal      # "verbose" (full HUD) | "minimal" (800x480 kiosk)
