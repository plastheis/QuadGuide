platform:
  name: rk3588               # label only; camera backend comes from camera.backend
  camera:
    # HIL toggle: set backend=raw_tcp (or network) + serial.mode=tcp below to
    # drive the stack from the dev-machine simulator instead of real hardware.
    backend: v4l2       # "v4l2" | "gstreamer" | "virtual" | "network" | "raw_tcp" (HIL)
    pipeline: "v4l2src device=/dev/video0 ! video/x-raw,width=640,height=480,framerate=30/1 ! appsink"
    width: 640
    height: 480
    fps: 30             # C920 hardware max (no 60fps mode); see USBCamera._force_constant_framerate
    url: "http://192.168.86.46:8090/camera"   # used when backend=network — dev-machine MJPEG stream
    # raw_tcp (HIL): low-latency uncompressed BGR frames from the dev-machine
    # RawFrameServer over TCP (no JPEG, no VideoCapture buffering). Preferred HIL
    # camera path on a direct-connect 1GbE link.
    raw_tcp_host: "192.168.86.46"   # used when backend=raw_tcp — dev-machine frame server host
    raw_tcp_port: 8091              # used when backend=raw_tcp — dev-machine frame server port
  serial:
    # This board exposes only /dev/ttyFIQ0 out of the box. For the CRSF link to
    # the FC, enable a UART overlay (e.g. uart3/uart5) so a /dev/ttyS* node
    # appears, then set it here. ttyFIQ0 is the fiq/console UART — not for CRSF.
    mode: tcp            # "uart" (real FC) | "tcp" (HIL — CRSF over TCP)
    port: /dev/ttyS6      # used when mode=uart — set to your enabled UART node
    baud: 420000          # CRSF standard — do not change without matching FC config
    tcp_host: "192.168.86.46"   # used when mode=tcp — dev-machine CRSF bridge host
    tcp_port: 42000             # used when mode=tcp — dev-machine CRSF bridge port
    rx_pin: "UART_RX"     # wiring reference only — not used by driver
    tx_pin: "UART_TX"     # wiring reference only — not used by driver
  realtime:
    tracker_cpu_core: 4   # A76 big core — EdgeCV CF/NN runs inline in this worker
    control_cpu_core: 6
    control_sched_fifo: true
    control_fifo_prio: 80

airframe:
  name: flix_micro
  mass_kg: 0.18
  inertia: [0.0012, 0.0012, 0.0020]
  control_limits:
    max_roll_deg: 40
    max_pitch_deg: 40
    max_roll_rate_dps: 200
    max_pitch_rate_dps: 200

tracker:
  # EdgeCV NanoTrack on the RK3588 NPU via the QuadGuide↔EdgeCV adapter.
  # Swap `tracker:` for mosse (CPU, no model), siamfc, yolo, acquire_track, or
  # verified_acquire_track (acquire_track + concurrent YOLO verification during
  # LOCKED — catches confident NanoTrack drift onto clutter; same params + verify_*).
  # `backend: auto` prefers rknn then onnx; force `mock` for a no-NPU dry run.
  import: quadguide.perception.edgecv_adapter:EdgeCVTracker
  params:
    tracker: acquire_track           # mosse | nanotrack | siamfc | yolo | acquire_track | verified_acquire_track
    backend: rknn                 # auto | onnx | rknn | mock
    model_dir: /home/radxa/EdgeCV/models   # resolves *.rknn artifacts (EDGECV_MODEL_DIR)
    color: bgr                    # QuadGuide camera frames are BGR; adapter swaps to RGB
    acquire_crop: 0.7          # central crop side, fraction of shorter dim
    lock_pad: 1.5              # padding on the YOLO box seeding NanoTrack
    lock_min_score: 0.1       # min YOLO score to commit a lock on operator LOCK
    drop_score: 0.9           # re-acquire confidence threshold: locked track below
                               # this for drop_frames frames triggers re-acquire
    drop_frames: 3             # sub-threshold (< drop_score) frames before re-acquire
    reacq_crop_factor: 3.0     # re-acq crop = factor × last bbox
    reacq_crop_frames: 15      # frames on the crop before full-frame escalation
    reacq_assoc_sigma: 0.5     # spatial gate (frac of frame) matching re-acq detections to last bbox
    lost_timeout_frames: 90    # coast budget before reporting LOST (~3 s @30fps)
    search_timeout_frames: 300 # post-LOST full-frame search before reset (~10 s)

    # verified_acquire_track only (YOLO runs concurrently during LOCKED):
    # verify: true               # enable concurrent YOLO verification (default true)
    # verify_min_iou: 0.1        # min IoU of NanoTrack box with a YOLO detection to count as supported
    # verify_min_score: 0.6     # min YOLO score for a detection to count toward support
    # verify_miss_frames: 5      # consecutive unsupported YOLO checks before declaring drift

  # ── AcquireTrack preset (YOLO-acquire → NanoTrack-track hybrid) ──
  # YOLO (yolo11n, NPU core 1) scans a fixed central crop and streams candidate
  # boxes to the HUD; the operator's LOCK button locks the current best detection
  # into NanoTrack (NPU core 2). On confidence drop YOLO re-acquires (crop → full
  # frame) and re-locks. Both models run in their own spawned workers. Requires
  # yolo11n.<soc>.rknn in model_dir (convert the trained ONNX with EdgeCV
  # tools/convert.py). To use, replace the params block above with:
  #   params:
  #     tracker: acquire_track
  #     backend: rknn
  #     model_dir: /home/radxa/EdgeCV/models
  #     color: bgr
  #     acquire_crop: 0.5          # central crop side, fraction of shorter dim
  #     lock_pad: 1.15             # padding on the YOLO box seeding NanoTrack
  #     lock_min_score: 0.35       # min YOLO score to commit a lock on operator LOCK
  #     drop_score: 0.35           # re-acquire confidence threshold (see active block)
  #     drop_frames: 5             # sub-threshold (< drop_score) frames before re-acquire
  #     reacq_crop_factor: 3.0     # re-acq crop = factor × last bbox
  #     reacq_crop_frames: 15      # frames on the crop before full-frame escalation
  #     reacq_assoc_sigma: 0.5     # spatial gate (frac of frame) matching re-acq detections to last bbox
  #     lost_timeout_frames: 90    # coast budget before reporting LOST (~3 s @30fps)
  #     search_timeout_frames: 300 # post-LOST full-frame search before reset (~10 s)

guidance:
  method: pronav              # "pronav" | "pure_pursuit"
  fov_horizontal_rad: 0.972   # Logitech C920 @ 640x480 (4:3, sides cropped from 16:9 sensor) ≈ 55.7°
  throttle_hold: 0.4         # constant throttle during tracking (0–1)
  pronav:
    N: 1.7                    # PN navigation gain (typical 3–5)
    closing_vel_fallback: 1.0
    closing_vel_ema_alpha: 0.01       # EMA smoothing for bbox area rate (0=heavy, 1=raw)
    closing_vel_min_area_rate: 0.001 # fallback if smoothed area rate is below this
    closing_vel_area_scale: 0.01      # area-rate (normalised/s) → m/s conversion
  pure_pursuit:
    K: 50                    # m/s² per radian of LOS angle

watchdog:
  target_estimate_ms: 200
  fc_attitude_ms: 250
  fc_imu_ms: 250
  guidance_accel_ms: 100

link:
  tx_rate_hz: 50          # RC channels uplink rate to FC (Hz) — must stay constant to keep FC out of failsafe
  diff_lowpass_alpha: 0.3 # LP filter alpha for attitude-derived body rates (0=heavy smooth, 1=raw)
  channels:
    # madflight channel calibration (µs). Used by encode_rc to map ControlCmd to CRSF ticks.
    roll:        {min_us: 1100, mid_us: 1500, max_us: 1900}
    pitch:       {min_us: 1100, mid_us: 1500, max_us: 1900}
    throttle:    {min_us: 1100, max_us: 1900}
    yaw:         {min_us: 1100, mid_us: 1500, max_us: 1900}
    arm:         {disarmed_us: 988, armed_us: 2012}
    flight_mode: {mode_index: 4, positions_us: [1165, 1295, 1425, 1555, 1685, 1815]}
    roll_pitch_scale: 40.0
    yaw_rate_scale: 160.0

mission:
  mode: bench_hil             # "flight" | "bench_hil" | "swil"
  hil:
    target_model: constant_velocity
    initial_offset_m: [2.0, 0.0, 0.0]
    target_speed_mps: 1.5

logging:
  level: INFO
  dir: /var/log/quadguide
  max_bytes: 10485760         # 10 MB per file
  backup_count: 3

bus:
  ring_depth: 8

diag:
  trace: false        # post-run latency/state trace; enable per-run with `run.py --log`
  trace_dir: null     # default: {logging.dir}/trace/<timestamp> (resolved by run.py)
  trace_max_rows: 0   # per-process row cap; 0 = unbounded
