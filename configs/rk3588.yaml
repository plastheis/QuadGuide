platform:
  name: rk3588               # label only; camera backend comes from camera.backend
  camera:
    # HIL toggle: set backend=raw_tcp (or network) + serial.mode=tcp below to
    # drive the stack from the dev-machine simulator instead of real hardware.
    backend: csi        # "v4l2" | "gstreamer" | "csi" | "virtual" | "network" | "raw_tcp" (HIL)
    # csi: OV9281 global-shutter mono via direct V4L2 (rkcif Y10/RAW10). The sensor
    # is Y10-only and GStreamer has no Y10 mapping, so the "gstreamer"/video11 ISP
    # path can't be used — CSIY10Camera streams the rkcif raw node and unpacks here.
    # OV9281 mono Y10 on the raw rkcif node. Captures the FULL sensor (1280x800,
    # full FoV) and downscales to width x height — asking the raw node for a smaller
    # size returns a top-left CROP, not a binned frame, so it would lose ~75% of the
    # FoV. No ISP on this path => no auto-exposure, so gain/exposure are fixed here.
    device: /dev/video0   # used when backend=csi — rkcif raw node (NOT /dev/video11 ISP)
    width: 640               # processed/output frame width (downscaled from 1280, 16:10)
    height: 400              # 16:10 (OV9281 native aspect) — full FoV preserved
    fps: 60
    # Software auto-exposure (no ISP/AEC on the raw path). Meters the 95th-percentile
    # brightness (≈ the flat sky) and holds it just below clipping, so a target
    # silhouetted against the sky keeps headroom/contrast instead of the sky blowing
    # out. gain/exposure below seed the loop; set auto_exposure: false to pin them.
    auto_exposure: true      # csi: software AEC loop
    ae_target: 210           # csi: AE setpoint (95th-pctl, 0..255) — lower = darker sky, more headroom
    gain: 16                 # csi: OV9281 analogue_gain 16..248 (AE seed / fixed value)
    exposure: 800            # csi: OV9281 exposure in lines 4..3652 (AE seed / fixed value)
    url: "http://192.168.86.46:8090/camera"   # used when backend=network — dev-machine MJPEG stream
    # raw_tcp (HIL): low-latency uncompressed BGR frames from the dev-machine
    # RawFrameServer over TCP (no JPEG, no VideoCapture buffering). Preferred HIL
    # camera path on a direct-connect 1GbE link.
    raw_tcp_host: "192.168.86.46"   # used when backend=raw_tcp — dev-machine frame server host
    raw_tcp_port: 8091              # used when backend=raw_tcp — dev-machine frame server port
  serial:
    # MAVLink2 link to the ArduPilot FC. This board exposes only /dev/ttyFIQ0 out
    # of the box; enable a UART overlay (e.g. uart3/uart5) so a /dev/ttyS* node
    # appears, then set it here. mode=tcp drives the stack from ArduPilot SITL.
    mode: uart            # was tcp (HIL); real MAVLink2 over UART to the FC
    port: /dev/ttyS6      # UART6-M1 (enable overlay "Enable UART6-M1"); see docs/sbc-setup.md
    baud: 921600          # H743 MAVLink2 baud — TODO confirm SERIALn_BAUD (115200 vs 921600)
    tcp_host: "192.168.86.46"   # used when mode=tcp — host running ArduPilot SITL
    tcp_port: 5760              # used when mode=tcp — SITL MAVLink TCP port
    rx_pin: "UART_RX"     # wiring reference only — not used by driver
    tx_pin: "UART_TX"     # wiring reference only — not used by driver
  realtime:
    tracker_cpu_core: 4   # A76 big core — EdgeCV CF/NN runs inline in this worker
    control_cpu_core: 6
    control_sched_fifo: true
    control_fifo_prio: 80

airframe:
  name: flix_micro
  mass_kg: 0.18
  inertia: [0.0012, 0.0012, 0.0020]
  control_limits:
    max_roll_deg: 40
    max_pitch_deg: 40
    max_roll_rate_dps: 200
    max_pitch_rate_dps: 200

tracker:
  # EdgeCV AcquireTrack on the RK3588 NPU via the QuadGuide↔EdgeCV adapter:
  # YOLO acquires on a central crop, the operator's LOCK seeds NanoTrack, and on a
  # confidence drop YOLO re-acquires full-frame and re-seeds with the next
  # confident detection (no detection within lost_timeout_frames ⇒ LOST).
  # Swap `tracker:` for mosse (CPU, no model), siamfc, yolo, or
  # verified_acquire_track (adds concurrent YOLO verification during LOCKED to
  # catch confident NanoTrack drift onto clutter; same params + verify_*).
  # `backend: auto` prefers rknn then onnx; force `mock` for a no-NPU dry run.
  import: quadguide.perception.edgecv_adapter:EdgeCVTracker
  params:
    tracker: nanotrack           # mosse | nanotrack | siamfc | yolo | acquire_track | verified_acquire_track
    backend: rknn                 # auto | onnx | rknn | mock
    model_dir: /home/radxa/EdgeCV/models   # resolves *.rknn artifacts (EDGECV_MODEL_DIR)
    color: bgr                    # QuadGuide camera frames are BGR; adapter swaps to RGB
    #  acquire_crop: 0.7          # central crop side, fraction of shorter dim
    # lock_pad: 1.5              # padding on the YOLO box seeding NanoTrack
    # lock_min_score: 0.15       # min YOLO score to commit a lock / re-seed NanoTrack
    # drop_score: 0.85          # re-acquire confidence threshold: locked track below
                               # this for drop_frames frames triggers re-acquire
    # drop_frames: 1             # sub-threshold (< drop_score) frames before re-acquire
    # lost_timeout_frames: 90    # full-frame re-acq budget before LOST (~3 s @30fps)
    # search_timeout_frames: 300 # post-LOST full-frame search before reset (~10 s)

    # verified_acquire_track only (YOLO runs concurrently during LOCKED):
    # verify: true               # enable concurrent YOLO verification (default true)
    # verify_min_iou: 0.1        # min IoU of NanoTrack box with a YOLO detection to count as supported
    # verify_min_score: 0.6     # min YOLO score for a detection to count toward support
    # verify_miss_frames: 5      # consecutive unsupported YOLO checks before declaring drift

guidance:
  method: pure_pursuit              # "pronav" | "pure_pursuit"
  fov_horizontal_rad: 1.379   # 79° HORIZONTAL (OV9281 + lens). If 79° is the lens
                              # DIAGONAL spec, horizontal at 16:10 ≈ 67° → use 1.17.
  throttle_hold: 0.6         # constant throttle during tracking (0–1)
  pronav:
    N: 1.5                    # PN navigation gain (typical 3–5)
    closing_vel_fallback: 1.0
    closing_vel_ema_alpha: 0.01       # EMA smoothing for bbox area rate (0=heavy, 1=raw)
    closing_vel_min_area_rate: 0.001 # fallback if smoothed area rate is below this
    closing_vel_area_scale: 0.01      # area-rate (normalised/s) → m/s conversion
  pure_pursuit:
    K: 15                    # m/s² per radian of LOS angle
    deadband: 0.03           # centroid half-width (frac of half-FoV ≈ 0.8°) zeroed near boresight

watchdog:
  target_estimate_ms: 200
  fc_attitude_ms: 250
  fc_imu_ms: 250
  guidance_accel_ms: 100

failsafe:
  # Target-loss disarm (see configs/rpi4b.yaml). Disabled on this build by default;
  # the RK3588 flight config typically runs acquire_track, whose LOST is already
  # heavily debounced. Enable if running bare nanotrack here.
  disarm_on_lost: false
  lost_hold_ms: 300

link:
  tx_rate_hz: 100          # SET_ATTITUDE_TARGET stream rate (Hz) — keep constant to hold GUIDED setpoints
  stream_rate_hz: 50      # requested ATTITUDE + RAW_IMU telemetry rate (Hz)
  system_id: 1            # quadguide MAVLink source system id
  component_id: 191       # MAV_COMP_ID_ONBOARD_COMPUTER
  target_system: 1        # FC system id (corrected at runtime from the first HEARTBEAT)
  target_component: 1     # MAV_COMP_ID_AUTOPILOT1
  arm_retry_count: 5      # arm/disarm COMMAND_LONG retransmits before giving up
  heartbeat_wait_s: 5.0   # max wait for the first FC HEARTBEAT before requesting streams

mission:
  mode: flight             # "flight" | "bench_hil" | "swil"
  hil:
    target_model: constant_velocity
    initial_offset_m: [2.0, 0.0, 0.0]
    target_speed_mps: 1.5

ground:
  port: 8080
  ui_mode: minimal           # "verbose" (full telemetry UI) | "minimal" (800x480 kiosk)

logging:
  level: INFO
  dir: /var/log/quadguide
  max_bytes: 10485760         # 10 MB per file
  backup_count: 3

bus:
  ring_depth: 8

diag:
  trace: false        # post-run latency/state trace; enable per-run with `run.py --log`
  trace_dir: null     # default: {logging.dir}/trace/<timestamp> (resolved by run.py)
  trace_max_rows: 0   # per-process row cap; 0 = unbounded
